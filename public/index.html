<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmileClinic DMS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #F7F4EE;
      --surface: #FDFBF7;
      --surface2: #DDE7E3;
      --border: #C4D4CF;
      --text: #102B35;
      --text2: #4A6168;
      --text3: #7A9298;
      --green: #2A6E52;
      --green-bg: #D4EDE4;
      --green-bd: #89C4A8;
      --amber: #B58B55;
      --amber-bg: #F5ECD8;
      --amber-bd: #D4A96A;
      --red: #B84040;
      --red-bg: #F5DADA;
      --red-bd: #D48989;
      --blue: #2A5566;
      --blue-bg: #D4E4EC;
      --blue-bd: #89B4C4;
      --sidebar: 236px;
      --r: 2px;
      --font: 'DM Sans', sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --eu: #789B92;
      --eu-lt: #A8C4BB;
      --brass: #B58B55;
      --brass-lt: #C9A870;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh
    }

    /* ── AUTH ─────────────────────────────────────── */
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr
    }

    .auth-brand {
      background: var(--text);
      padding: 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden
    }

    .auth-brand::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      border: 90px solid rgba(255, 255, 255, .07);
      top: -110px;
      right: -110px
    }

    .auth-brand::after {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 60px solid rgba(255, 255, 255, .05);
      bottom: 50px;
      left: -70px
    }

    .auth-logo {
      font-family: var(--serif);
      font-size: 26px;
      color: #fff;
      z-index: 1
    }

    .auth-hl {
      z-index: 1
    }

    .auth-hl h1 {
      font-family: var(--serif);
      font-size: 44px;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 14px
    }

    .auth-hl p {
      color: rgba(255, 255, 255, .65);
      font-size: 15px;
      line-height: 1.65;
      max-width: 300px
    }

    .auth-copy {
      font-size: 12px;
      color: rgba(255, 255, 255, .35);
      z-index: 1
    }

    .auth-form {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: var(--surface)
    }

    .auth-box {
      width: 100%;
      max-width: 400px
    }

    .auth-box h2 {
      font-family: var(--serif);
      font-size: 30px;
      margin-bottom: 5px
    }

    .auth-box .sub {
      color: var(--text2);
      margin-bottom: 28px;
      font-size: 14px
    }

    /* quick role pills */
    .role-strip {
      display: flex;
      gap: 5px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 18px
    }

    .rpill {
      flex: 1;
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      transition: all .15s
    }

    .rpill.on {
      background: var(--surface);
      color: var(--green);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .09)
    }


    /* ── ROLE CARDS (website-matched login) ─────────────────── */
    .auth-role-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-radius: var(--r);
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .06);
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all .2s;
      font-family: var(--font);
    }

    .auth-role-btn:hover,
    .auth-role-btn.active {
      background: rgba(255, 255, 255, .18);
      border-color: rgba(255, 255, 255, .35);
      transform: translateX(4px);
    }

    .auth-role-icon {
      font-size: 1.1rem;
      line-height: 1
    }

    .auth-role-name {
      font-size: .85rem;
      font-weight: 500;
      color: #fff
    }

    .auth-role-desc {
      font-size: .72rem;
      color: rgba(255, 255, 255, .45);
      margin-top: 1px
    }

    /* ── FORM ─────────────────────────────────────── */
    .fg {
      margin-bottom: 15px
    }

    .fg label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 5px
    }

    .fg input,
    .fg select,
    .fg textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s
    }

    .fg input:focus,
    .fg select:focus,
    .fg textarea:focus {
      border-color: var(--green)
    }

    .fg textarea {
      resize: vertical;
      min-height: 70px
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 17px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all .15s;
      line-height: 1
    }

    .btn-primary {
      background: var(--brass);
      color: #fff
    }

    .btn-primary:hover {
      background: #0A2029
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border)
    }

    .btn-secondary:hover {
      background: var(--border)
    }

    .btn-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-bd)
    }

    .btn-danger:hover {
      filter: brightness(.95)
    }

    .btn-ghost {
      background: none;
      color: var(--text2);
      border: 1px solid var(--border)
    }

    .btn-ghost:hover {
      background: var(--surface2)
    }

    .btn-full {
      width: 100%
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px
    }

    .err-msg {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-bd);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 13px;
      margin-bottom: 14px
    }

    /* ── LAYOUT ───────────────────────────────────── */
    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: var(--sidebar);
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 100
    }

    .sb-logo {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border)
    }

    .sb-logo-name {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -.01em
    }

    .sb-logo-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 1px
    }

    .sb-nav {
      flex: 1;
      padding: 12px 10px;
      overflow-y: auto
    }

    .sb-sec {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 0 8px;
      margin: 18px 0 7px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: all .12s;
      margin-bottom: 2px
    }

    .nav-item:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .nav-item.active {
      background: rgba(120, 155, 146, .12);
      color: var(--text);
      border-left: 2px solid var(--brass);
      padding-left: 8px
    }

    .nav-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      flex-shrink: 0
    }

    .sb-footer {
      padding: 14px;
      border-top: 1px solid var(--border)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px;
      background: var(--surface2);
      border-radius: 9px
    }

    .av {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0
    }

    .av.sm {
      width: 26px;
      height: 26px;
      font-size: 11px;
      border-radius: 6px
    }

    .u-name {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .u-role {
      font-size: 11px;
      color: var(--text3);
      text-transform: capitalize
    }

    .logout-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: 15px;
      padding: 3px;
      border-radius: 5px;
      line-height: 1
    }

    .logout-btn:hover {
      color: var(--red)
    }

    .main {
      margin-left: var(--sidebar);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50
    }

    .page-title {
      font-family: var(--serif);
      font-size: 20px
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .content {
      padding: 24px;
      flex: 1
    }

    /* ── BADGES ───────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap
    }

    .bg-green {
      background: rgba(181, 139, 85, .12);
      color: var(--brass);
      border-color: var(--green-bd)
    }

    .bg-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: var(--amber-bd)
    }

    .bg-red {
      background: var(--red-bg);
      color: var(--red);
      border-color: var(--red-bd)
    }

    .bg-blue {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: var(--blue-bd)
    }

    .bg-gray {
      background: var(--surface2);
      color: var(--text2);
      border-color: var(--border)
    }

    /* ── STAT CARDS ───────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      position: relative;
      overflow: hidden
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--accent-color, var(--green))
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px
    }

    .stat-val {
      font-family: var(--serif);
      font-size: 32px;
      line-height: 1;
      color: var(--accent-color, var(--text))
    }

    .stat-sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 5px
    }

    /* ── PANELS ───────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 18px
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border)
    }

    .panel-title {
      font-weight: 600;
      font-size: 14px
    }

    .panel-body {
      padding: 20px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .chart-wrap {
      height: 210px;
      position: relative
    }

    /* ── TABLE ────────────────────────────────────── */
    .tbl {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 10px 16px;
      border-bottom: 1.5px solid var(--border);
      background: var(--bg);
      white-space: nowrap
    }

    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13.5px
    }

    tr:last-child td {
      border-bottom: none
    }

    tr:hover td {
      background: var(--bg)
    }

    .td-main {
      font-weight: 500
    }

    .td-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px
    }

    /* ── TOOLBAR ──────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .search {
      position: relative;
      flex: 1;
      min-width: 180px
    }

    .search input {
      width: 100%;
      padding: 9px 13px 9px 34px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      background: var(--surface);
      outline: none;
      transition: border-color .2s
    }

    .search input:focus {
      border-color: var(--green)
    }

    .search-ic {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3)
    }

    /* ── MODAL ────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .38);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      animation: fadeIn .15s
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .16);
      animation: slideUp .2s ease;
      max-height: 90vh;
      overflow-y: auto
    }

    .modal-lg {
      max-width: 640px
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px
    }

    .modal-head h3 {
      font-family: var(--serif);
      font-size: 22px
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: 20px;
      line-height: 1;
      padding: 3px;
      border-radius: 5px
    }

    .close-btn:hover {
      color: var(--text);
      background: var(--surface2)
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border)
    }

    /* ── TOAST ────────────────────────────────────── */
    .toast-wrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .toast {
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
      animation: slideUp .2s
    }

    .toast.ok {
      background: var(--green);
      color: #fff
    }

    .toast.er {
      background: var(--red);
      color: #fff
    }

    .toast.in {
      background: #1C1917;
      color: #fff
    }

    /* ── ML SPECIFIC ──────────────────────────────── */
    .risk-bar-row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .risk-track {
      height: 5px;
      border-radius: 3px;
      background: var(--border);
      flex: 1;
      overflow: hidden
    }

    .risk-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s
    }

    .prob-big {
      font-family: var(--serif);
      font-size: 52px;
      line-height: 1;
      text-align: center;
      margin: 8px 0
    }

    .action-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      border-left: 3px solid;
      margin-top: 12px;
      line-height: 1.5
    }

    .feat-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px
    }

    .feat-name {
      font-size: 11px;
      color: var(--text2);
      width: 170px;
      flex-shrink: 0;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .feat-track {
      flex: 1;
      height: 7px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden
    }

    .feat-fill {
      height: 100%;
      border-radius: 4px
    }

    .feat-val {
      font-size: 10px;
      font-family: monospace;
      width: 44px;
      text-align: right;
      color: var(--text3)
    }

    /* ── MISC ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 44px 20px;
      color: var(--text3)
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 10px;
      opacity: .5
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 0 auto
    }

    .loading-block {
      padding: 36px;
      text-align: center;
      color: var(--text3)
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0
    }

    a.link-btn {
      background: none;
      border: none;
      color: var(--green);
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      padding: 0;
      text-decoration: underline
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .page {
      animation: slideUp .2s ease
    }

    @media(max-width:800px) {
      .auth-brand {
        display: none
      }

      .auth-wrap {
        grid-template-columns: 1fr
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr
      }

      .g2 {
        grid-template-columns: 1fr
      }

      .sidebar {
        width: 58px
      }

      .sb-logo-name,
      .sb-logo-sub,
      .nav-item span,
      .u-name,
      .u-role,
      .sb-sec {
        display: none
      }

      .nav-item {
        justify-content: center;
        padding: 12px
      }

      .main {
        margin-left: 58px
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script>
    'use strict';
    // ═══════════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════════
    const API_BASE = (() => {
      // Auto-detect: if running on Vercel/online or local server, use relative /api
      const DEPLOY_URL = '';  // e.g. 'https://yourclinic.onrender.com/api'
      if (DEPLOY_URL) return DEPLOY_URL;
      if (typeof window !== 'undefined' && window.location && window.location.origin && !window.location.origin.includes('file://')) {
        return '/api';
      }
      return 'http://localhost:5000/api';
    })();

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let STATE = {
      user: null, page: 'dashboard',
      patients: [], doctors: [], appointments: [],
      invoices: [], treatments: [], stats: {},
    };

    // ═══════════════════════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════════════════════
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmtRs = n => '₹' + Number(n || 0).toLocaleString('en-IN');
    const fmtDT = s => s ? s.slice(0, 16).replace('T', ' ') : '—';
    const fmtD = s => s ? s.slice(0, 10) : '—';
    const role = () => STATE.user?.role || '';
    const isAdmin = () => role() === 'admin';
    const isDoctor = () => role() === 'doctor';
    const isRecept = () => role() === 'receptionist';
    const canEdit = () => ['admin', 'receptionist'].includes(role());
    const canSeeML = () => role() === 'admin';
    const canSeeBilling = () => ['admin', 'receptionist'].includes(role());

    function toast(msg, type = 'ok') {
      const d = document.createElement('div');
      d.className = `toast ${type}`;
      d.innerHTML = `<span>${type === 'ok' ? '✓' : type === 'er' ? '✕' : 'ℹ'}</span><span>${esc(msg)}</span>`;
      document.getElementById('toasts').appendChild(d);
      setTimeout(() => d.remove(), 3200);
    }
    function riskBadge(risk, prob) {
      const r = risk || (prob >= .6 ? 'High' : prob >= .35 ? 'Medium' : prob != null ? 'Low' : null);
      if (!r) return '<span class="badge bg-gray">—</span>';
      const cls = { High: 'bg-red', Medium: 'bg-amber', Low: 'bg-green' }[r] || 'bg-gray';
      return `<span class="badge ${cls}">${r}${prob != null ? ' ' + (prob * 100).toFixed(0) + '%' : ''}</span>`;
    }
    function statusBadge(s) {
      const m = { scheduled: 'bg-blue', confirmed: 'bg-green', completed: 'bg-gray', cancelled: 'bg-red', no_show: 'bg-amber', paid: 'bg-green', pending: 'bg-amber', overdue: 'bg-red' };
      return `<span class="badge ${m[s] || 'bg-gray'}">${esc(s)}</span>`;
    }

    // ═══════════════════════════════════════════════════════════
    //  API CLIENT
    // ═══════════════════════════════════════════════════════════
    async function api(method, path, body) {
      const token = localStorage.getItem('sc_token');
      try {
        const res = await fetch(API_BASE + path, {
          method,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          ...(body ? { body: JSON.stringify(body) } : {})
        });
        const j = await res.json();
        if (!j.success && res.status === 401) { localStorage.removeItem('sc_token'); STATE.user = null; renderPage(); }
        return j;
      } catch (e) {
        const msg = 'Cannot reach server — make sure server.py is running at localhost:8080';
        return { success: false, error: { message: msg, detail: e.message } };
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  DATA LOADING
    // ═══════════════════════════════════════════════════════════
    async function loadData() {
      const calls = [
        api('GET', '/patients'), api('GET', '/doctors'),
        api('GET', '/appointments'), api('GET', '/treatments'),
        api('GET', '/stats/dashboard'),
      ];
      // billing only for admin/receptionist
      if (canSeeBilling()) calls.push(api('GET', '/invoices'));

      const [p, d, a, t, s, i] = await Promise.all(calls);
      if (p.success) STATE.patients = p.data;
      if (d.success) STATE.doctors = d.data;
      if (a.success) STATE.appointments = a.data;
      if (t.success) STATE.treatments = t.data;
      if (s.success) STATE.stats = s.data;
      if (i?.success) STATE.invoices = i.data;
    }

  <div class="form-row">

    async function saveNewPatient() {
      const fn = document.getElementById('pf-fn').value.trim(), ph = document.getElementById('pf-ph').value.trim();
      if (!fn || !ph) { toast('First name and phone required', 'er'); return; }
      const r = await api('POST', '/patients', { first_name: fn, last_name: document.getElementById('pf-ln').value.trim(), date_of_birth: document.getElementById('pf-dob').value, gender: document.getElementById('pf-gd').value, phone: ph, blood_group: document.getElementById('pf-bl').value, allergies: document.getElementById('pf-al').value || 'None', medical_notes: document.getElementById('pf-mn').value, email: document.getElementById('pf-em').value });
      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }
      toast('Patient added'); closeModal(); await loadData(); renderPage();
    }
    async function openEditPatient(id) {
      const p = STATE.patients.find(x => x.patient_id === id); if (!p) return;
      openModal(`
  <div class="modal-head"><h3>Edit Patient</h3><button class="close-btn" onclick="closeModal()">✕</button></div>
  <div class="form-row">
    <div class="fg"><label>First name</label><input id="ef-fn" value="${esc(p.first_name)}"/></div>
    <div class="fg"><label>Last name</label><input id="ef-ln" value="${esc(p.last_name)}"/></div>
  </div>
  <div class="fg"><label>Phone</label><input id="ef-ph" value="${esc(p.phone)}"/></div>
  <div class="fg"><label>Address</label><input id="ef-ad" value="${esc(p.address || '')}"/></div>
  <div class="fg"><label>Allergies</label><input id="ef-al" value="${esc(p.allergies || '')}"/></div>
  <div class="fg"><label>Medical notes</label><textarea id="ef-mn">${esc(p.medical_notes || '')}</textarea></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveEditPatient(${id})">Update Patient</button>
  </div>`);
    }
    async function saveEditPatient(id) {
      const r = await api('PATCH', `/patients/${id}`, { first_name: document.getElementById('ef-fn').value, last_name: document.getElementById('ef-ln').value, phone: document.getElementById('ef-ph').value, address: document.getElementById('ef-ad').value, allergies: document.getElementById('ef-al').value, medical_notes: document.getElementById('ef-mn').value });
      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }
      toast('Patient updated'); closeModal(); await loadData(); renderPage();
    }
    async function deletePatient(id) {
      if (!confirm('Delete this patient? This cannot be undone.')) return;
      const r = await api('DELETE', `/patients/${id}`);
      if (r.success) { toast('Patient deleted', 'in'); await loadData(); renderPage(); }
      else toast(r.error?.message || 'Error', 'er');
    }

    //  APPOINTMENTS PAGE  (role-aware)
    // ═══════════════════════════════════════════════════════════
    function appointmentsPage() {
      // Doctor: show only their own appointments + highlight patient clickable
      const appts = STATE.appointments;
      const rows = appts.map(a => `<tr>
    <td style="cursor:pointer" onclick="openPatientProfile(${a.patient_id || 0},'${esc(a.patient_name)}')">
      <div class="td-main" style="color:var(--eu);text-decoration:underline;text-underline-offset:2px">${esc(a.patient_name)}</div>
    </td>
    <td>
      ${canEdit() ? `
      <select style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text);cursor:pointer;max-width:160px"
        onchange="assignDoctor(${a.appointment_id},this.value)"
        ${a.status === 'cancelled' ? 'disabled' : ''}>
        <option value="">Unassigned</option>
        ${STATE.doctors.map(d => `<option value="${d.doctor_id}" ${a.doctor_id === d.doctor_id ? 'selected' : ''}>Dr. ${esc(d.last_name)}</option>`).join('')}
      </select>` :
          `<span style="font-size:13px;color:var(--text2)">${esc(a.doctor_name || 'Unassigned')}</span>`}
    </td>
    <td><span style="font-family:monospace;font-size:12px">${fmtDT(a.scheduled_at)}</span></td>
    <td><span style="color:var(--text2)">${esc(a.reason || '—')}</span></td>
    <td>${priorityBadge(a.priority || 'normal')}</td>
    <td>${statusBadge(a.status)}</td>
    <td>${riskBadge(a.risk_level, a.no_show_probability)}</td>
    <td><div style="display:flex;gap:4px">
      ${a.status === 'scheduled' && canEdit() ? `<button class="btn btn-sm btn-primary" onclick="confirmAppt(${a.appointment_id})">Confirm</button>` : ''}
      ${['scheduled', 'confirmed'].includes(a.status) && (canEdit() || isDoctor()) ? `<button class="btn btn-sm btn-danger" onclick="cancelAppt(${a.appointment_id})">Cancel</button>` : ''}
    </div></td>
  </tr>`).join('');

      return `

  </div>
  <div class="toolbar">
    <div class="search"><span class="search-ic">🔍</span>
      <input id="ap-s" placeholder="Search by patient or reason…" oninput="filterTable('ap-s','ap-body',0,3)"/>
    </div>
    <button class="btn btn-sm btn-ghost" onclick="filterByPriority('')" id="pf-all" style="border-color:var(--green);color:var(--green)">All</button>
    <button class="btn btn-sm btn-ghost" onclick="filterByPriority('urgent')" id="pf-urgent">🔴 Urgent</button>
    <button class="btn btn-sm btn-ghost" onclick="filterByPriority('high')" id="pf-high">🟠 High</button>
    <button class="btn btn-sm btn-ghost" onclick="filterByPriority('normal')" id="pf-normal">🔵 Normal</button>
    ${canEdit() || isDoctor() ? `<button class="btn btn-primary" onclick="openAddAppt()">+ Schedule</button>` : ''}
  </div>
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Appointments (${appts.length})</span>
      <span class="badge bg-blue">${appts.filter(a => a.status === 'scheduled').length} upcoming</span>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>Patient</th><th>Assign Doctor</th><th>Date & Time</th><th>Reason</th><th>Priority</th><th>Status</th><th>Risk</th><th>Actions</th></tr></thead>
      <tbody id="ap-body">
      ${rows || '<tr><td colspan="7" class="empty"><div class="empty-icon">📅</div>No appointments.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
    }
    async function assignDoctor(appointmentId, doctorId) {
      if (!doctorId) return;
      const r = await api('PATCH', '/appointments/' + appointmentId, { doctor_id: parseInt(doctorId) });
      if (r.success) {
        showToast('Doctor assigned');
        await loadData(); renderPage();
      } else {
        showToast(r.error?.message || 'Error assigning doctor', 'er');
      }
    }
    async function confirmAppt(id) { const r = await api('PATCH', `/appointments/${id}`, { status: 'confirmed' }); if (r.success) { toast('Confirmed'); await loadData(); renderPage(); } }
    async function cancelAppt(id) { if (!confirm('Cancel this appointment?')) return; const r = await api('DELETE', `/appointments/${id}`); if (r.success) { toast('Cancelled', 'in'); await loadData(); renderPage(); } }
    function openAddAppt() {
      const pts = STATE.patients, docs = STATE.doctors, txs = STATE.treatments;
      const now = new Date(); now.setMinutes(0, 0, 0);
      const dtLocal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      openModal(`
  <div class="modal-head"><h3>Schedule Appointment</h3><button class="close-btn" onclick="closeModal()">✕</button></div>
  <div class="form-row">
    <div class="fg"><label>Patient *</label><select id="af-pt">${pts.length ? pts.map(p => `<option value="${p.patient_id}">${esc(p.first_name + ' ' + p.last_name)}</option>`).join('') : '<option>No patients</option>'}</select></div>
    <div class="fg"><label>Doctor *</label><select id="af-dr">${docs.map(d => `<option value="${d.doctor_id}">Dr. ${esc(d.first_name + ' ' + d.last_name)}</option>`).join('')}</select></div>
  </div>
  <div class="form-row">
    <div class="fg"><label>Date & time *</label><input id="af-dt" type="datetime-local" value="${dtLocal}"/></div>
    <div class="fg"><label>Duration (mins)</label><input id="af-du" type="number" value="30" min="15" step="15"/></div>
  </div>
  <div class="fg"><label>Treatment</label><select id="af-tx">${txs.map(t => `<option value="${t.treatment_id}">${esc(t.treatment_name)} — ${fmtRs(t.base_cost)}</option>`).join('')}</select></div>
  <div class="fg"><label>Reason / chief complaint</label><input id="af-re" placeholder="e.g. Toothache upper right…"/></div>
  <div class="fg"><label>Priority</label>
    <select id="af-pri">
      <option value="urgent">🔴 Urgent — needs immediate attention</option>
      <option value="high">🟠 High — see today if possible</option>
      <option value="normal" selected>🔵 Normal — routine appointment</option>
      <option value="low">⚪ Low — flexible scheduling</option>
    </select>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveAppt()">Schedule Appointment</button>
  </div>`, true);
    }
    async function saveAppt() {
      const pid = parseInt(document.getElementById('af-pt').value), did = parseInt(document.getElementById('af-dr').value), dt = document.getElementById('af-dt').value;
      if (!pid || !dt) { toast('Patient and date/time required', 'er'); return; }
      const btn = document.querySelector('.modal-foot .btn-primary'); btn.textContent = 'Scheduling…'; btn.disabled = true;
      const r = await api('POST', '/appointments', { patient_id: pid, doctor_id: did, scheduled_at: dt, duration_mins: parseInt(document.getElementById('af-du').value) || 30, treatment_id: parseInt(document.getElementById('af-tx').value) || 1, reason: document.getElementById('af-re').value, priority: document.getElementById('af-pri').value });
      btn.textContent = 'Schedule + Score'; btn.disabled = false;
      if (!r.success) { toast(r.error?.message || 'Error scheduling', 'er'); return; }
      const d = r.data;
      toast('Appointment scheduled successfully');
      closeModal(); await loadData(); renderPage();
    }

      const rows = inv.map(i => `<tr>

      <div class="td-main" style="color:var(--eu);text-decoration:underline;text-underline-offset:2px">${esc(i.patient_name || '—')}</div>

    async function saveDoctor() {
      const fn = document.getElementById('df-fn').value.trim();
      const ln = document.getElementById('df-ln').value.trim();
      const em = document.getElementById('df-em').value.trim();
      const pw = document.getElementById('df-pw').value;
      if (!fn || !em || !pw) { toast('Name, email and password are required', 'er'); return; }
      if (pw.length < 6) { toast('Password must be at least 6 characters', 'er'); return; }
      const btn = document.querySelector('#add-doc-btn');
      if (btn) { btn.textContent = 'Adding…'; btn.disabled = true; }

      // Step 1: create login account
      const uname = 'dr_' + fn.toLowerCase().replace(/\s+/g, '_') + '_' + (Date.now() % 9999);
      const userRes = await api('POST', '/auth/register', { username: uname, email: em, password: pw, role: 'doctor' });
      if (!userRes.success) {
        if (btn) { btn.textContent = 'Add Doctor'; btn.disabled = false; }
        toast(userRes.error?.message || 'Email may already be registered', 'er');
        return;
      }

      // Step 2: get the user_id from the response
      const d = userRes.data || {};
      const newUserId = d.userId || d.user_id || (d.user && d.user.userId);
      if (!newUserId) {
        toast('Registration succeeded but user_id missing — contact admin', 'er');
        return;
      }

      // Step 3: create doctor profile linked to that user
      const docRes = await api('POST', '/doctors', {
        first_name: fn,
        last_name: ln,
        specialisation: document.getElementById('df-sp').value,
        license_number: document.getElementById('df-lic').value.trim() || 'LIC-' + Date.now(),
        phone: document.getElementById('df-ph').value.trim(),
        consultation_fee: parseFloat(document.getElementById('df-fee').value) || 0,
        user_id: newUserId
      });
      if (btn) { btn.textContent = 'Add Doctor'; btn.disabled = false; }
      if (!docRes.success) { toast(docRes.error?.message || 'Error creating doctor profile', 'er'); return; }
      toast(`✅ Dr. ${fn} ${ln} added! Login: ${em}`);
      closeModal(); await loadData(); renderPage();
    }

      const el = document.getElementById('ml-res');
      el.innerHTML = '<div style="text-align:center;padding:16px"><div class="spinner"></div></div>';
      const r = await api('POST', '/ml/predict/manual', { lead_time_days: parseInt(document.getElementById('ml-ld').value) || 0, prior_no_shows: parseInt(document.getElementById('ml-pr').value) || 0, appointment_hour: parseInt(document.getElementById('ml-hr').value) || 10, age: parseInt(document.getElementById('ml-ag').value) || 30, distance_km: parseFloat(document.getElementById('ml-di').value) || 5, treatment_cost: parseFloat(document.getElementById('ml-co').value) || 1000, previous_appointments: 2, month: 5, reminder_sent: parseInt(document.getElementById('ml-rm').value), has_insurance: parseInt(document.getElementById('ml-in').value), is_follow_up: 0, gender: 'other', day_of_week: document.getElementById('ml-dy').value, treatment_category: document.getElementById('ml-ca').value });
      if (!r.success) { el.innerHTML = `<div class="err-msg" style="margin-top:12px">${r.error?.message}</div>`; return; }
      const d = r.data, pct = (d.no_show_probability * 100).toFixed(1);
      const color = d.risk_level === 'High' ? 'var(--red)' : d.risk_level === 'Medium' ? 'var(--amber)' : 'var(--green)';
      const bg = d.risk_level === 'High' ? 'var(--red-bg)' : d.risk_level === 'Medium' ? 'var(--amber-bg)' : 'var(--green-bg)';
      const bd = d.risk_level === 'High' ? 'var(--red-bd)' : d.risk_level === 'Medium' ? 'var(--amber-bd)' : 'var(--green-bd)';
      el.innerHTML = `<div style="margin-top:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:18px;animation:slideUp .2s">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px">No-show probability</div>
      <div style="font-family:var(--serif);font-size:54px;line-height:1;color:${color}">${pct}%</div>
      <div style="margin-top:8px">${riskBadge(d.risk_level, d.no_show_probability)}</div>
    </div>
    <div style="background:${bg};border:1px solid ${bd};border-left:3px solid ${color};border-radius:8px;padding:10px 13px;font-size:13px;color:${color}">${d.recommended_action}</div>
    <div style="margin-top:10px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between"><span>Model v${d.model_version}</span><span>Confidence: ${d.confidence} · Threshold: ${d.threshold_used}</span></div>
  </div>`;
    }

    // ═══════════════════════════════════════════════════════════
    //  FILTER HELPER
    // ═══════════════════════════════════════════════════════════

    function priorityBadge(p) {
      const cfg = {
        urgent: { cls: 'bg-red', icon: '🔴', label: 'Urgent' },
        high: { cls: 'bg-amber', icon: '🟠', label: 'High' },
        normal: { cls: 'bg-blue', icon: '🔵', label: 'Normal' },
        low: { cls: 'bg-gray', icon: '⚪', label: 'Low' },
      };
      const c = cfg[p] || cfg.normal;
      return `<span class="badge ${c.cls}" title="Priority: ${c.label}">${c.icon} ${c.label}</span>`;
    }

    function filterByPriority(p) {
      // update button styles
      ['all', 'urgent', 'high', 'normal'].forEach(id => {
        const el = document.getElementById('pf-' + id);
        if (!el) return;
        const active = (p === '' && id === 'all') || p === id;
        el.style.borderColor = active ? 'var(--green)' : 'var(--border)';
        el.style.color = active ? 'var(--green)' : 'var(--text2)';
        el.style.fontWeight = active ? '600' : '500';
      });
      const rows = document.querySelectorAll('#ap-body tr');
      rows.forEach(r => {
        if (!p) { r.style.display = ''; return; }
        // priority cell is index 4 (Patient=0,Doctor=1,DateTime=2,Reason=3,Status=4,Risk=5,Priority=6... wait check col order)
        const cells = r.querySelectorAll('td');
        const priCell = cells[4]; // priority is 5th column (0-indexed: patient,doctor,datetime,reason,priority,status,risk,actions)
        r.style.display = (priCell && priCell.textContent.toLowerCase().includes(p)) ? '' : 'none';
      });
    }

    // ── Consultation Update Modal ─────────────────────────────────────────────
    async function openConsultation(appointmentId, patientName, currentNotes) {
      openModal(`
  <div class="modal-head">
    <h3>📋 Consultation Notes</h3>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
  <div style="background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--blue)">
    Patient: <strong>${escHtml(patientName)}</strong> · Appointment #${appointmentId}
  </div>

  <div class="fg">
    <label>Consultation Notes</label>
    <textarea id="cons-notes" style="min-height:120px;resize:vertical" placeholder="Findings, diagnosis, treatment performed, medications prescribed…">${escHtml(currentNotes || '')}</textarea>
  </div>

  <div class="fg">
    <label>Follow-up required?</label>
    <select id="cons-followup">
      <option value="">No follow-up needed</option>
      <option value="1 week">In 1 week</option>
      <option value="2 weeks">In 2 weeks</option>
      <option value="1 month">In 1 month</option>
      <option value="3 months">In 3 months</option>
      <option value="6 months">In 6 months</option>
    </select>
  </div>

  <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:4px;background:var(--surface2)">
    <div style="font-weight:600;font-size:13px;margin-bottom:10px">Mark appointment status</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:rgba(181,139,85,.12);color:var(--brass);border:1px solid var(--green-bd)"
        onclick="saveConsultation(${appointmentId},'completed','${escHtml(patientName)}')">
        ✅ Mark as Completed
      </button>
      <button class="btn btn-sm btn-ghost"
        onclick="saveConsultation(${appointmentId},'confirmed','${escHtml(patientName)}')">
        💾 Save Notes Only
      </button>
      <button class="btn btn-sm" style="background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)"
        onclick="saveConsultation(${appointmentId},'no_show','${escHtml(patientName)}')">
        ❌ Mark No-show
      </button>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
  </div>`, true);
    }

    function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    async function saveConsultation(appointmentId, status, patientName) {
      const notes = document.getElementById('cons-notes').value;
      const followup = document.getElementById('cons-followup').value;
      const fullNotes = notes + (followup ? `\n\nFollow-up: ${followup}` : '');

      const btn = event?.target;
      if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }

      const r = await api('PATCH', '/appointments/' + appointmentId, {
        status: status,
        notes: fullNotes,
      });

      if (!r.success) {
        toast(r.error?.message || 'Error saving', 'er');
        if (btn) { btn.disabled = false; }
        return;
      }

      const statusMsg = {
        completed: '✅ Appointment marked as completed',
        confirmed: '💾 Notes saved',
        no_show: '❌ Marked as no-show',
      }[status] || 'Saved';

      toast(statusMsg);
      closeModal();
      await loadData();
      renderPage();
    }

    function filterTable(inputId, tbodyId, ...cols) {
      const q = document.getElementById(inputId)?.value.toLowerCase() || '';
      document.getElementById(tbodyId)?.querySelectorAll('tr').forEach(r => {
        const cells = r.querySelectorAll('td');
        r.style.display = (cols.length ? cols.some(i => cells[i]?.textContent.toLowerCase().includes(q)) : r.textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════════════
    function renderPage() {
      const app = document.getElementById('app');
      try {
        if (!STATE.user) { app.innerHTML = authPage(); return; }
        let inner = '';
        if (STATE.page === 'dashboard') inner = dashboardPage();
        else if (STATE.page === 'patients') inner = patientsPage();
        else if (STATE.page === 'appointments') inner = appointmentsPage();
        else if (STATE.page === 'billing') inner = billingPage();
        else if (STATE.page === 'doctors') inner = doctorsPage();
        else if (STATE.page === 'ml') inner = mlPage();
        else inner = dashboardPage();
        app.innerHTML = shell(inner);
      } catch (err) {
        console.error('renderPage error:', err);
        if (app) app.innerHTML = authPage();
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  BOOT
    // ═══════════════════════════════════════════════════════════
    (async () => {
      try {
        const token = localStorage.getItem('sc_token');
        if (token) {
          const r = await api('GET', '/auth/me');
          if (r.success && r.data) { STATE.user = r.data; await loadData(); }
          else localStorage.removeItem('sc_token');
        }
      } catch (e) {
        console.error('Boot error:', e);
      } finally {
        renderPage();
      }
    })();
  </script>
</body>

</html>
