<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmileClinic DMS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #F7F5F1;
      --surface: #fff;
      --surface2: #F0EDE7;
      --border: #E3DED7;
      --text: #1C1917;
      --text2: #6B6560;
      --text3: #A8A29E;
      --green: #15803D;
      --green-bg: #DCFCE7;
      --green-bd: #86EFAC;
      --amber: #B45309;
      --amber-bg: #FEF3C7;
      --amber-bd: #FCD34D;
      --red: #DC2626;
      --red-bg: #FEE2E2;
      --red-bd: #FCA5A5;
      --blue: #1D4ED8;
      --blue-bg: #DBEAFE;
      --blue-bd: #93C5FD;
      --sidebar: 236px;
      --r: 10px;
      --font: 'DM Sans', sans-serif;
      --serif: 'DM Serif Display', serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh
    }

    /* ── AUTH ─────────────────────────────────────── */
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr
    }

    .auth-brand {
      background: var(--green);
      padding: 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden
    }

    .auth-brand::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      border: 90px solid rgba(255, 255, 255, .07);
      top: -110px;
      right: -110px
    }

    .auth-brand::after {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 60px solid rgba(255, 255, 255, .05);
      bottom: 50px;
      left: -70px
    }

    .auth-logo {
      font-family: var(--serif);
      font-size: 26px;
      color: #fff;
      z-index: 1
    }

    .auth-hl {
      z-index: 1
    }

    .auth-hl h1 {
      font-family: var(--serif);
      font-size: 44px;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 14px
    }

    .auth-hl p {
      color: rgba(255, 255, 255, .65);
      font-size: 15px;
      line-height: 1.65;
      max-width: 300px
    }

    .auth-copy {
      font-size: 12px;
      color: rgba(255, 255, 255, .35);
      z-index: 1
    }

    .auth-form {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: var(--surface)
    }

    .auth-box {
      width: 100%;
      max-width: 400px
    }

    .auth-box h2 {
      font-family: var(--serif);
      font-size: 30px;
      margin-bottom: 5px
    }

    .auth-box .sub {
      color: var(--text2);
      margin-bottom: 28px;
      font-size: 14px
    }

    /* quick role pills */
    .role-strip {
      display: flex;
      gap: 5px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 18px
    }

    .rpill {
      flex: 1;
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      transition: all .15s
    }

    .rpill.on {
      background: var(--surface);
      color: var(--green);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .09)
    }

    /* ── FORM ─────────────────────────────────────── */
    .fg {
      margin-bottom: 15px
    }

    .fg label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 5px
    }

    .fg input,
    .fg select,
    .fg textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s
    }

    .fg input:focus,
    .fg select:focus,
    .fg textarea:focus {
      border-color: var(--green)
    }

    .fg textarea {
      resize: vertical;
      min-height: 70px
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 17px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all .15s;
      line-height: 1
    }

    .btn-primary {
      background: var(--green);
      color: #fff
    }

    .btn-primary:hover {
      background: #166534
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border)
    }

    .btn-secondary:hover {
      background: var(--border)
    }

    .btn-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-bd)
    }

    .btn-danger:hover {
      filter: brightness(.95)
    }

    .btn-ghost {
      background: none;
      color: var(--text2);
      border: 1px solid var(--border)
    }

    .btn-ghost:hover {
      background: var(--surface2)
    }

    .btn-full {
      width: 100%
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px
    }

    .err-msg {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-bd);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 13px;
      margin-bottom: 14px
    }

    /* ── LAYOUT ───────────────────────────────────── */
    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: var(--sidebar);
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 100
    }

    .sb-logo {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border)
    }

    .sb-logo-name {
      font-family: var(--serif);
      font-size: 21px;
      color: var(--green)
    }

    .sb-logo-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 1px
    }

    .sb-nav {
      flex: 1;
      padding: 12px 10px;
      overflow-y: auto
    }

    .sb-sec {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 0 8px;
      margin: 18px 0 7px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: all .12s;
      margin-bottom: 2px
    }

    .nav-item:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .nav-item.active {
      background: var(--green-bg);
      color: var(--green)
    }

    .nav-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      flex-shrink: 0
    }

    .sb-footer {
      padding: 14px;
      border-top: 1px solid var(--border)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px;
      background: var(--surface2);
      border-radius: 9px
    }

    .av {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0
    }

    .av.sm {
      width: 26px;
      height: 26px;
      font-size: 11px;
      border-radius: 6px
    }

    .u-name {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .u-role {
      font-size: 11px;
      color: var(--text3);
      text-transform: capitalize
    }

    .logout-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: 15px;
      padding: 3px;
      border-radius: 5px;
      line-height: 1
    }

    .logout-btn:hover {
      color: var(--red)
    }

    .main {
      margin-left: var(--sidebar);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50
    }

    .page-title {
      font-family: var(--serif);
      font-size: 20px
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .content {
      padding: 24px;
      flex: 1
    }

    /* ── BADGES ───────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.2;
    }

    .bg-green {
      background: var(--green-bg);
      color: var(--green);
      border-color: var(--green-bd)
    }

    .bg-amber {
      background: #FEF3C7;
      color: #B45309;
      border-color: #FCD34D
    }

    .bg-red {
      background: #FEE2E2;
      color: #DC2626;
      border-color: #FCA5A5
    }

    .bg-blue {
      background: #DBEAFE;
      color: #1D4ED8;
      border-color: #93C5FD
    }

    .bg-gray {
      background: #EFECE6;
      color: #57534E;
      border-color: transparent
    }

    /* Action buttons matching screenshot */
    .btn-consult {
      background: #15803D !important;
      color: #FFFFFF !important;
      border-radius: 9999px !important;
      padding: 6px 14px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border: none !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
      line-height: 1 !important;
      white-space: nowrap !important;
    }

    .btn-consult:hover {
      background: #166534 !important;
      box-shadow: 0 2px 6px rgba(21, 128, 61, 0.3) !important;
    }

    .btn-view {
      background: #EFECE6 !important;
      color: #374151 !important;
      border-radius: 9999px !important;
      padding: 6px 14px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border: 1px solid #D1D5DB !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
      line-height: 1 !important;
      white-space: nowrap !important;
    }

    .btn-view:hover {
      background: #E3DFD7 !important;
      color: #111827 !important;
      border-color: #9CA3AF !important;
    }

    /* ── STAT CARDS ───────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      position: relative;
      overflow: hidden
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--accent-color, var(--green))
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px
    }

    .stat-val {
      font-family: var(--serif);
      font-size: 32px;
      line-height: 1;
      color: var(--accent-color, var(--text))
    }

    .stat-sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 5px
    }

    /* ── PANELS ───────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 18px
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border)
    }

    .panel-title {
      font-weight: 600;
      font-size: 14px
    }

    .panel-body {
      padding: 20px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .chart-wrap {
      height: 210px;
      position: relative
    }

    /* ── TABLE ────────────────────────────────────── */
    .tbl {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 10px 16px;
      border-bottom: 1.5px solid var(--border);
      background: var(--bg);
      white-space: nowrap
    }

    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13.5px
    }

    tr:last-child td {
      border-bottom: none
    }

    tr:hover td {
      background: var(--bg)
    }

    .td-main {
      font-weight: 500
    }

    .td-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px
    }

    /* ── TOOLBAR ──────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .search {
      position: relative;
      flex: 1;
      min-width: 180px
    }

    .search input {
      width: 100%;
      padding: 9px 13px 9px 34px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      background: var(--surface);
      outline: none;
      transition: border-color .2s
    }

    .search input:focus {
      border-color: var(--green)
    }

    .search-ic {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3)
    }

    /* ── MODAL ────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .38);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      animation: fadeIn .15s
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .16);
      animation: slideUp .2s ease;
      max-height: 90vh;
      overflow-y: auto
    }

    .modal-lg {
      max-width: 640px
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px
    }

    .modal-head h3 {
      font-family: var(--serif);
      font-size: 22px
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: 20px;
      line-height: 1;
      padding: 3px;
      border-radius: 5px
    }

    .close-btn:hover {
      color: var(--text);
      background: var(--surface2)
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border)
    }

    /* ── TOAST ────────────────────────────────────── */
    .toast-wrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .toast {
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
      animation: slideUp .2s
    }

    .toast.ok {
      background: var(--green);
      color: #fff
    }

    .toast.er {
      background: var(--red);
      color: #fff
    }

    .toast.in {
      background: #1C1917;
      color: #fff
    }

    /* ── ML SPECIFIC ──────────────────────────────── */
    .risk-bar-row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .risk-track {
      height: 5px;
      border-radius: 3px;
      background: var(--border);
      flex: 1;
      overflow: hidden
    }

    .risk-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s
    }

    .prob-big {
      font-family: var(--serif);
      font-size: 52px;
      line-height: 1;
      text-align: center;
      margin: 8px 0
    }

    .action-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      border-left: 3px solid;
      margin-top: 12px;
      line-height: 1.5
    }

    .feat-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px
    }

    .feat-name {
      font-size: 11px;
      color: var(--text2);
      width: 170px;
      flex-shrink: 0;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .feat-track {
      flex: 1;
      height: 7px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden
    }

    .feat-fill {
      height: 100%;
      border-radius: 4px
    }

    .feat-val {
      font-size: 10px;
      font-family: monospace;
      width: 44px;
      text-align: right;
      color: var(--text3)
    }

    /* ── MISC ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 44px 20px;
      color: var(--text3)
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 10px;
      opacity: .5
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 0 auto
    }

    .loading-block {
      padding: 36px;
      text-align: center;
      color: var(--text3)
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0
    }

    a.link-btn {
      background: none;
      border: none;
      color: var(--green);
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      padding: 0;
      text-decoration: underline
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .page {
      animation: slideUp .2s ease
    }

    @media(max-width:800px) {
      .auth-brand {
        display: none
      }

      .auth-wrap {
        grid-template-columns: 1fr
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr
      }

      .g2 {
        grid-template-columns: 1fr
      }

      .sidebar {
        width: 58px
      }

      .sb-logo-name,
      .sb-logo-sub,
      .nav-item span,
      .u-name,
      .u-role,
      .sb-sec {
        display: none
      }

      .nav-item {
        justify-content: center;
        padding: 12px
      }

      .main {
        margin-left: 58px
      }
    }

    /* ── INVOICE PREVIEW & PRINTING ── */
    .invoice-preview-container {
      background: #fff;
      color: #1C1917;
      padding: 30px;
      border-radius: 8px;
      font-family: var(--font);
      line-height: 1.5;
    }

<body>

  <div id="app"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script>
    'use strict';
    // ═══════════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════════
    const API_BASE = '/api';

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let STATE = {
      user: null, page: 'dashboard',
      patients: [], doctors: [], appointments: [],
      invoices: [], treatments: [], prescriptions: [], stats: {},
      myPatientProfile: null
    };

    // ═══════════════════════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════════════════════
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmtRs = n => '₹' + Number(n || 0).toLocaleString('en-IN');
    const fmtDT = s => s ? s.slice(0, 16).replace('T', ' ') : '—';
    const fmtD = s => s ? s.slice(0, 10) : '—';
    const role = () => STATE.user?.role || '';
    const isAdmin = () => role() === 'admin';
    const isDoctor = () => role() === 'doctor';
    const isRecept = () => role() === 'receptionist';
    const canEdit = () => ['admin', 'receptionist'].includes(role());
    const canSeeML = () => role() === 'admin';
    const canSeeBilling = () => ['admin', 'receptionist'].includes(role());

    function currentDoctorId() {
      if (!isDoctor() || !STATE.user) return null;
      const uid = STATE.user.userId || STATE.user.user_id;
      const doc = STATE.doctors.find(d => Number(d.user_id) === Number(uid));
      if (doc) return doc.doctor_id;
      const userEmail = (STATE.user.email || '').toLowerCase();
      if (userEmail) {
        const docByEmail = STATE.doctors.find(d => (d.email || '').toLowerCase() === userEmail);
        if (docByEmail) return docByEmail.doctor_id;
      }
      return null;
    }

    function toast(msg, type = 'ok') {
      const container = document.getElementById('toasts');
      if (!container) return;
      const d = document.createElement('div');
      d.className = `toast ${type}`;
      d.innerHTML = `<span>${type === 'ok' ? '✓' : type === 'er' ? '✕' : 'ℹ'}</span><span>${esc(msg)}</span>`;
      container.appendChild(d);
      setTimeout(() => d.remove(), 3200);
    }
    function riskBadge(risk, prob) {
      if (isDoctor()) return '';
      const r = risk || (prob >= .6 ? 'High' : prob >= .35 ? 'Medium' : prob != null ? 'Low' : null);
      if (!r) return '<span class="badge bg-gray">—</span>';
      const cls = { High: 'bg-red', Medium: 'bg-amber', Low: 'bg-green' }[r] || 'bg-gray';
      return `<span class="badge ${cls}">${r}${prob != null ? ' ' + (prob * 100).toFixed(0) + '%' : ''}</span>`;
    }
    function statusBadge(s) {
      const m = { scheduled: 'bg-blue', confirmed: 'bg-green', completed: 'bg-gray', cancelled: 'bg-red', no_show: 'bg-amber', paid: 'bg-green', pending: 'bg-amber', overdue: 'bg-red' };
      return `<span class="badge ${m[s] || 'bg-gray'}">${esc(s)}</span>`;
    }

    // ═══════════════════════════════════════════════════════════
    //  API CLIENT
    // ═══════════════════════════════════════════════════════════
    async function api(method, path, body) {
      const token = localStorage.getItem('sc_token');
      try {
        const res = await fetch(API_BASE + path, {
          method,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          ...(body ? { body: JSON.stringify(body) } : {})
        });
        const j = await res.json();
        if (!j.success && res.status === 401 && path !== '/auth/login') {
          if (localStorage.getItem('sc_token')) {
            localStorage.removeItem('sc_token');
            STATE.user = null;
            renderPage();
          }
        }
        return j;
      } catch (e) {
        toast('Cannot reach server. Make sure the backend server is running.', 'er');
        return { success: false, error: { message: e.message } };
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  DATA LOADING
    // ═══════════════════════════════════════════════════════════
    async function loadData() {
      if (!localStorage.getItem('sc_token')) return;
      const calls = [
        api('GET', '/patients'), api('GET', '/doctors'),
        api('GET', '/appointments'), api('GET', '/treatments'),
        api('GET', '/stats/dashboard'), api('GET', '/prescriptions'),
      ];
      if (canSeeBilling() || role() === 'patient') calls.push(api('GET', '/invoices'));
      if (role() === 'patient') calls.push(api('GET', '/patients/me'));

      const res = await Promise.all(calls);
      const toArr = val => Array.isArray(val) ? val : (val?.items || []);
      if (res[0]?.success) STATE.patients = toArr(res[0].data);
      if (res[1]?.success) STATE.doctors = toArr(res[1].data);
      if (res[2]?.success) STATE.appointments = toArr(res[2].data);
      if (res[3]?.success) STATE.treatments = toArr(res[3].data);
      if (res[4]?.success) STATE.stats = res[4].data || {};
      if (res[5]?.success) STATE.prescriptions = toArr(res[5].data);
      if (res[6]?.success) STATE.invoices = toArr(res[6].data);
      if (role() === 'patient' && res[7]?.success) STATE.myPatientProfile = res[7].data;
    }

    // ═══════════════════════════════════════════════════════════
    //  TABLE SEARCH & RELEVANCE FILTERING
    // ═══════════════════════════════════════════════════════════
    function filterTable(inputId, tbodyId, ...colIndices) {
      const input = document.getElementById(inputId);
      const tbody = document.getElementById(tbodyId);
      if (!input || !tbody) return;

      const q = input.value.trim().toLowerCase();
      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (!rows.length || (rows.length === 1 && rows[0].querySelector('.empty'))) return;

      // Store initial DOM order
      rows.forEach((r, idx) => {
        if (r.dataset.origIdx === undefined) {
          r.dataset.origIdx = idx.toString();
        }
      });

      if (!q) {
        // Reset: restore original order and display all rows
        rows.sort((a, b) => (parseInt(a.dataset.origIdx || '0') - parseInt(b.dataset.origIdx || '0')));
        rows.forEach(r => {
          r.style.display = '';
          tbody.appendChild(r);
        });
        return;
      }

      const qWords = q.split(/\s+/).filter(Boolean);

      const scoredRows = rows.map(row => {
        const cells = Array.from(row.cells);
        let textToSearch = '';
        if (colIndices.length > 0) {
          textToSearch = colIndices
            .map(i => (cells[i] ? cells[i].textContent : ''))
            .join(' ')
            .toLowerCase();
        } else {
          textToSearch = row.textContent.toLowerCase();
        }

        let score = 0;
        if (textToSearch.includes(q)) score += 100;

        let allWordsMatch = true;
        for (const w of qWords) {
          if (textToSearch.includes(w)) {
            score += 20;
          } else {
            allWordsMatch = false;
          }
        }
        if (allWordsMatch) score += 50;

        return { row, score };
      });

      const matched = scoredRows.filter(sr => sr.score > 0);
      const nonMatched = scoredRows.filter(sr => sr.score === 0);

      // Hide non-matching rows
      nonMatched.forEach(sr => {
        sr.row.style.display = 'none';
      });

      // Sort matched rows by highest score so matching patient appears at the top
      matched.sort((a, b) => b.score - a.score || (parseInt(a.row.dataset.origIdx || '0') - parseInt(b.row.dataset.origIdx || '0')));

      matched.forEach(sr => {
        sr.row.style.display = '';
        tbody.appendChild(sr.row);
      });
    }

    async function doLogin() {
      const loginInput = (document.getElementById('a-email')?.value || '').trim();
      const pass = document.getElementById('a-pass')?.value || '';
      const errEl = document.getElementById('auth-err');
      if (errEl) errEl.style.display = 'none';
      if (!loginInput || !pass) {
        if (errEl) { errEl.textContent = 'Please enter your username/email and password'; errEl.style.display = 'block'; }
        return;
      }
      const btn = document.getElementById('login-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }
      try {
        const r = await api('POST', '/auth/login', { email: loginInput, username: loginInput, password: pass });
        if (!r.success) {
          if (errEl) { errEl.textContent = r.error?.message || 'Login failed'; errEl.style.display = 'block'; }

        localStorage.setItem('sc_token', r.data.token); STATE.user = r.data.user;

    function patientsPage() {

          const myPatientIds = new Set(STATE.appointments.filter(a => Number(a.doctor_id) === Number(docId)).map(a => Number(a.patient_id)));

        }
      }
      const rows = pts.map(p => {
        const age = p.date_of_birth ? Math.floor((Date.now() - new Date(p.date_of_birth)) / (365.25 * 864e5)) : '?';

      <td><div style="display:flex;align-items:center;gap:9px">
        <div class="av sm">${(p.first_name || '?')[0]}</div>
        <div>
          <div class="td-main" style="color:var(--green);text-decoration:underline">${esc(p.first_name)} ${esc(p.last_name)}</div>

        ${canEdit() ? `<button class="btn btn-sm btn-ghost" onclick="openEditPatient(${p.patient_id})">Edit</button>` : ''}
        ${isAdmin() ? `<button class="btn btn-sm btn-danger" onclick="deletePatient(${p.patient_id})">Del</button>` : ''}

      return `

      ${rows || '<tr><td colspan="6" class="empty"><div class="empty-icon"></div>No patients yet.</td></tr>'}
      </tbody>
    </table></div>

    function generateRandomPassword(targetId) {
      const num = Math.floor(1000 + Math.random() * 9000);
      const pass = 'Smile' + num;

        input.value = pass;
        input.type = 'text';

      toast(`Generated password: ${pass}`);

    async function saveNewPatient() {
      const fn = document.getElementById('pf-fn').value.trim(), ph = document.getElementById('pf-ph').value.trim();
      if (!fn || !ph) { toast('First name and phone required', 'er'); return; }
      const em = document.getElementById('pf-em').value.trim();
      const pw = document.getElementById('pf-pw').value.trim();

      const r = await api('POST', '/patients', {
        first_name: fn,
        last_name: document.getElementById('pf-ln').value.trim(),
        date_of_birth: document.getElementById('pf-dob').value,
        gender: document.getElementById('pf-gd').value,
        phone: ph,
        blood_group: document.getElementById('pf-bl').value,
        allergies: document.getElementById('pf-al').value || 'None',
        medical_notes: document.getElementById('pf-mn').value,
        email: em,
        password: pw
      });

      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }

      const createdEmail = r.data.login_email || em || `${fn.toLowerCase()}_patient@clinic.local`;
      const createdPw = r.data.raw_password || pw || 'patient123';

      closeModal();
      await loadData();
      renderPage();

      openModal(`
        <div class="modal-head">
          <h3 style="color:var(--green)">Patient Registered Successfully!</h3>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="padding:16px;background:var(--surface2);border-radius:10px;margin-bottom:16px;border:1px solid var(--border)">
          <div style="font-size:14px;margin-bottom:12px">
            Patient: <strong>${esc(fn)} ${esc(r.data.last_name || '')}</strong>
          </div>
          <div style="margin-bottom:10px">
            <span style="font-size:11px;color:var(--text3);display:block;text-transform:uppercase">Login Email</span>
            <strong style="font-family:monospace;font-size:14px;color:var(--text)">${esc(createdEmail)}</strong>
          </div>
          <div>
            <span style="font-size:11px;color:var(--text3);display:block;text-transform:uppercase">Stored Password</span>
            <strong style="font-family:monospace;font-size:18px;color:var(--green);background:var(--surface);padding:4px 10px;border-radius:6px;display:inline-block;border:1px solid var(--green-bd);margin-top:2px">${esc(createdPw)}</strong>

        </div>

        </div>
      `, true);
    }

    async function openEditPatient(id) {
      const p = STATE.patients.find(x => x.patient_id === id); if (!p) return;
      openModal(`
  <div class="modal-head"><h3>Edit Patient</h3><button class="close-btn" onclick="closeModal()">✕</button></div>
  <div class="form-row">
    <div class="fg"><label>First name</label><input id="ef-fn" value="${esc(p.first_name)}"/></div>
    <div class="fg"><label>Last name</label><input id="ef-ln" value="${esc(p.last_name)}"/></div>
  </div>
  <div class="fg"><label>Phone</label><input id="ef-ph" value="${esc(p.phone)}"/></div>
  <div class="fg"><label>Address</label><input id="ef-ad" value="${esc(p.address || '')}"/></div>
  <div class="fg"><label>Allergies</label><input id="ef-al" value="${esc(p.allergies || '')}"/></div>

  <div class="modal-foot">
    ${isAdmin() ? `<button class="btn btn-sm btn-ghost" style="color:var(--amber);margin-right:auto" onclick="closeModal();openPatientChangePassword(${p.patient_id},'${esc(p.first_name + ' ' + p.last_name)}')">Reset Password</button>` : ''}
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveEditPatient(${id})">Update Patient</button>
  </div>`);
    }
    async function saveEditPatient(id) {
      const r = await api('PATCH', `/patients/${id}`, { first_name: document.getElementById('ef-fn').value, last_name: document.getElementById('ef-ln').value, phone: document.getElementById('ef-ph').value, address: document.getElementById('ef-ad').value, allergies: document.getElementById('ef-al').value, medical_notes: document.getElementById('ef-mn').value });
      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }
      toast('Patient updated'); closeModal(); await loadData(); renderPage();
    }
    async function deletePatient(id) {
      if (!confirm('Delete this patient? This cannot be undone.')) return;
      const r = await api('DELETE', `/patients/${id}`);
      if (r.success) { toast('Patient deleted', 'in'); await loadData(); renderPage(); }
      else toast(r.error?.message || 'Error', 'er');
    }

    function openPatientChangePassword(id, name) {
      if (!isAdmin()) { toast('Only Admin can reset patient passwords', 'er'); return; }
      openModal(`

  </div>

    <label>New Password *</label>

    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="savePatientPassword(${id})">Update Password</button>
  </div>`, true);
    }

    async function savePatientPassword(id) {
      if (!isAdmin()) { toast('Only Admin can reset patient passwords', 'er'); return; }
      const np = document.getElementById('pat-pw-new').value.trim();
      if (!np) { toast('Password is required', 'er'); return; }
      if (np.length < 6) { toast('Password must be at least 6 characters', 'er'); return; }

      const r = await api('PATCH', `/patients/${id}/password`, { new_password: np });
      if (r.success) {
        closeModal();
        toast('Patient password updated!');
        openModal(`
          <div class="modal-head">
            <h3 style="color:var(--green)">Password Reset Complete</h3>
            <button class="close-btn" onclick="closeModal()">✕</button>
          </div>
          <div style="padding:16px;background:var(--surface2);border-radius:10px;margin-bottom:16px">

            <strong style="font-family:monospace;font-size:18px;color:var(--green);background:var(--surface);padding:6px 12px;border-radius:6px;display:inline-block;border:1px solid var(--green-bd)">${esc(np)}</strong>
          </div>
          <div class="modal-foot">
            <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${esc(np)}');toast('Password copied!');closeModal();">Copy Password & Close</button>
          </div>
        `, true);
      } else {
        toast(r.error?.message || 'Failed to update password', 'er');
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  APPOINTMENTS PAGE  (role-aware)
    // ═══════════════════════════════════════════════════════════
    function appointmentsPage() {
      const isDoc = isDoctor();
      const isPat = role() === 'patient';
      let appts = STATE.appointments;

      if (isDoc) {
        const docId = currentDoctorId();
        if (docId) {
          appts = appts.filter(a => Number(a.doctor_id) === Number(docId));
        } else {
          const userEmail = (STATE.user?.email || '').toLowerCase();
          const usernamePart = (STATE.user?.username || '').toLowerCase().replace('dr_', '');
          appts = appts.filter(a => {
            const docName = (a.doctor_name || '').toLowerCase();
            return (userEmail && docName.includes(userEmail.split('@')[0])) || (usernamePart && docName.includes(usernamePart));
          });
        }
      }

      const showNoShow = !isDoc && !isPat;
      const showActions = !isPat;

      const rows = appts.map(a => `<tr style="${isPat ? 'cursor:pointer' : ''}" onclick="${isPat ? `openConsultationAndRx(${a.appointment_id})` : ''}">
    <td style="cursor:pointer" onclick="${isPat ? '' : `openPatientProfile(${a.patient_id || 0},'${esc(a.patient_name)}')`}">
      <div class="td-main" style="color:var(--green);text-decoration:underline">${esc(a.patient_name)}</div>
    </td>
    <td><span style="font-size:13px;color:var(--text2)">Dr. ${esc(a.doctor_name)}</span></td>
    <td><span style="font-family:monospace;font-size:12px">${fmtDT(a.scheduled_at)}</span></td>
    <td><span style="color:var(--text2)">${esc(a.reason || '—')}</span></td>
    <td>${priorityBadge(a.priority || 'normal')}</td>
    <td>${statusBadge(a.status)}</td>
    ${showNoShow ? `<td>${riskBadge(a.risk_level, a.no_show_probability)}</td>` : ''}
    ${showActions ? `<td><div style="display:flex;gap:4px;align-items:center" onclick="event.stopPropagation()">
      ${(isDoctor() || isAdmin() || isPat) ? `<button class="btn btn-sm ${a.status === 'completed' ? 'btn-secondary' : 'btn-primary'}" onclick="openConsultationAndRx(${a.appointment_id})" title="${a.status === 'completed' ? 'View Visit & Prescription (Read Only)' : 'View Visit & Consult'}" style="display:inline-flex;align-items:center;gap:4px">${a.status === 'completed' ? 'View' : 'View & Consult'}</button>` : ''}
      ${a.status === 'completed' && isAdmin() ? `<button class="btn btn-sm btn-ghost" style="color:var(--amber);border:1px solid var(--amber-bd);background:var(--amber-bg)" onclick="reopenAppt(${a.appointment_id})" title="Re-open consultation for editing (Admin)">Re-open</button>` : ''}
      ${a.status === 'scheduled' && canEdit() ? `<button class="btn btn-sm btn-secondary" onclick="confirmAppt(${a.appointment_id})">Confirm</button>` : ''}
      ${['scheduled', 'confirmed'].includes(a.status) && canEdit() ? `<button class="btn btn-sm btn-ghost" style="background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)" onclick="cancelAppt(${a.appointment_id})">Cancel</button>` : ''}
      ${isAdmin() ? `<button class="btn btn-sm btn-danger" onclick="deleteAppt(${a.appointment_id})">Delete</button>` : ''}
    </div></td>` : ''}
  </tr>`).join('');

      const totalCols = 6 + (showNoShow ? 1 : 0) + (showActions ? 1 : 0);

      return `
  <div style="background:var(--green-bg);border:1px solid var(--green-bd);border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--green)">
    ${isPat ? 'Tip: Click any appointment row to view your consultation summary & digital prescription.' : 'Tip: Click any patient name to open their full profile and medical history.'}
  </div>

    <div class="search">

    async function cancelAppt(id) { if (!confirm('Cancel this appointment?')) return; const r = await api('POST', `/appointments/${id}/cancel`); if (r.success) { toast('Cancelled', 'in'); await loadData(); renderPage(); } else { toast(r.error?.message || 'Error', 'er'); } }
    async function deleteAppt(id) { if (!confirm('Delete this appointment permanently? This will remove related invoice/payment records.')) return; const r = await api('DELETE', `/appointments/${id}`); if (r.success) { toast('Deleted', 'in'); await loadData(); renderPage(); } else { toast(r.error?.message || 'Error', 'er'); } }

      if (!isAdmin()) { toast('Only Admin can re-open completed appointments', 'er'); return; }
      if (!confirm('Re-open this consultation? Status will be reset to scheduled so notes & prescriptions can be edited.')) return;
      const r = await api('PATCH', `/appointments/${id}`, { status: 'scheduled' });
      if (r.success) {
        toast('Consultation re-opened for editing');

    async function saveAppt() {
      const pid = parseInt(document.getElementById('af-pt').value), did = parseInt(document.getElementById('af-dr').value), dt = document.getElementById('af-dt').value;
      if (!pid || !did || !dt) { toast('Patient, available doctor, and date/time required', 'er'); return; }
      const docObj = STATE.doctors.find(d => d.doctor_id === did);
      if (docObj && !docObj.is_available) {
        toast(`Dr. ${docObj.first_name} ${docObj.last_name} is currently unavailable / off duty`, 'er');
        return;
      }
      const btn = document.querySelector('.modal-foot .btn-primary'); btn.textContent = 'Scheduling…'; btn.disabled = true;
      const r = await api('POST', '/appointments', { patient_id: pid, doctor_id: did, scheduled_at: dt, duration_mins: parseInt(document.getElementById('af-du').value) || 30, treatment_id: parseInt(document.getElementById('af-tx').value) || 1, reason: document.getElementById('af-re').value, priority: document.getElementById('af-pri').value });
      btn.textContent = 'Schedule + Score'; btn.disabled = false;
      if (!r.success) { toast(r.error?.message || 'Error scheduling', 'er'); return; }
      const d = r.data;
      toast('Appointment scheduled successfully');

      const upcoming = docAppts.filter(a => ['scheduled', 'confirmed'].includes(a.status));

  <div class="form-row">
    <div class="fg"><label>First name *</label><input id="df-fn" placeholder="Priya"/></div>

      <select id="df-sp"><option>General Dentistry</option><option>Orthodontics</option><option>Oral Surgery</option><option>Periodontics</option><option>Endodontics</option><option>Pediatric Dentistry</option></select>

  </div>

  </div>
  <div class="form-row">
    <div class="fg"><label>Consultation fee (₹)</label><input id="df-fee" type="number" value="600" min="0"/></div>
    <div class="fg"><label>Login email *</label><input id="df-em" type="email" placeholder="doctor@clinic.in"/></div>
  </div>
  <div class="fg"><label>Login password *</label><input id="df-pw" type="password" placeholder="min 6 characters"/></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveDoctor()" id="add-doc-btn">Add Doctor</button>
  </div>`);
    }
    async function saveDoctor() {
      const fn = document.getElementById('df-fn').value.trim();
      const ln = document.getElementById('df-ln').value.trim();
      const em = document.getElementById('df-em').value.trim();
      const pw = document.getElementById('df-pw').value;
      const qual = document.getElementById('df-qual').value.trim();
      if (!fn || !em || !pw) { toast('Name, email and password are required', 'er'); return; }
      if (pw.length < 6) { toast('Password must be at least 6 characters', 'er'); return; }
      const btn = document.querySelector('#add-doc-btn');
      if (btn) { btn.textContent = 'Adding…'; btn.disabled = false; }

      // Step 1: create login account
      const uname = 'dr_' + fn.toLowerCase().replace(/\s+/g, '_') + '_' + (Date.now() % 9999);
      const userRes = await api('POST', '/auth/register', { username: uname, email: em, password: pw, role: 'doctor' });
      
      let newUserId = null;
      if (userRes.success) {
        const d = userRes.data || {};
        newUserId = d.userId || d.user_id || (d.user && (d.user.userId || d.user.user_id));
      }

      // Step 2: create doctor profile linked to that user
      const docRes = await api('POST', '/doctors', {
        first_name: fn,
        last_name: ln,
        specialisation: document.getElementById('df-sp').value,
        qualification: qual || 'BDS, MDS',
        license_number: document.getElementById('df-lic').value.trim() || 'LIC-' + Date.now(),
        phone: document.getElementById('df-ph').value.trim(),
        consultation_fee: parseFloat(document.getElementById('df-fee').value) || 0,
        email: em,
        password: pw,
        user_id: newUserId
      });
      if (btn) { btn.textContent = 'Add Doctor'; btn.disabled = false; }
      if (!docRes.success) { toast(docRes.error?.message || 'Error creating doctor profile', 'er'); return; }
      toast(`Dr. ${fn} ${ln} added! Login: ${em}`);
      closeModal(); await loadData(); renderPage();
    }

    async function saveEditDoctor(id) {
      const r = await api('PATCH', '/doctors/' + id, {
        first_name: document.getElementById('ef-dfn').value,
        last_name: document.getElementById('ef-dln').value,
        qualification: document.getElementById('ef-dqual').value.trim(),
        specialisation: document.getElementById('ef-dsp').value,
        phone: document.getElementById('ef-dph').value,
        consultation_fee: parseFloat(document.getElementById('ef-dfee').value) || 0,
        is_available: parseInt(document.getElementById('ef-dav').value),
      });
      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }
      toast('Doctor updated'); closeModal(); await loadData(); renderPage();
    }

    // ── Toggle availability ────────────────────────────────────────
    async function toggleAvailability(id, newVal) {
      const r = await api('PATCH', '/doctors/' + id, { is_available: newVal });
      if (r.success) { toast(newVal ? 'Doctor set to Available' : 'Doctor set to Unavailable'); await loadData(); renderPage(); }
      else toast(r.error?.message || 'Error', 'er');

      openModal(`

  <div style="background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--amber)">

  </div>
  <div class="fg"><label>New password *</label><input id="pw-new" type="password" placeholder="min 6 characters"/></div>
  <div class="fg"><label>Confirm password *</label><input id="pw-confirm" type="password" placeholder="repeat password"/></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="savePassword(${id})">Update Password</button>
  </div>`);
    }
    async function savePassword(id) {
      const np = document.getElementById('pw-new').value;
      const cp = document.getElementById('pw-confirm').value;
      if (!np || np.length < 6) { toast('Password must be at least 6 characters', 'er'); return; }
      if (np !== cp) { toast('Passwords do not match', 'er'); return; }
      const r = await api('PATCH', '/doctors/' + id + '/password', { new_password: np });
      if (!r.success) { toast(r.error?.message || 'Error', 'er'); return; }
      toast('Password updated successfully'); closeModal();
    }

    // ── Delete Doctor ──────────────────────────────────────────────
    async function deleteDoctor(id, name) {
      if (!confirm(`Remove Dr. ${name} from the system?\n\nNote: Doctors with upcoming appointments cannot be removed.`)) return;

      if (!r.success) { toast(r.error?.message || 'Error removing doctor', 'er'); return; }
      toast(`Dr. ${name} removed`, 'in'); await loadData(); renderPage();
    }

    function mlPage() {
      const appts = STATE.appointments.filter(a => ['scheduled', 'confirmed'].includes(a.status));

      const med = appts.filter(a => a.risk_level === 'Medium').length;
      const rows = appts.map(a => {
        const prob = a.no_show_probability;
        const color = a.risk_level === 'High' ? 'var(--red)' : a.risk_level === 'Medium' ? 'var(--amber)' : 'var(--green)';
        return `<tr>

      <td style="font-size:12px;color:var(--text2)">${a.risk_level === 'High' ? 'Call' : a.risk_level === 'Medium' ? 'SMS' : 'Auto'}</td>
    </tr>`;
      }).join('');
      const feats = [['prior_no_shows', 0.281, 'var(--red)'], ['reminder_sent', 0.164, 'var(--green)'], ['lead_time_days', 0.132, 'var(--amber)'], ['has_insurance', 0.098, 'var(--green)'], ['distance_km', 0.081, 'var(--amber)'], ['treatment_cost', 0.073, 'var(--green)'], ['appointment_hour', 0.062, 'var(--amber)'], ['age', 0.051, 'var(--blue)'], ['day_of_week', 0.048, 'var(--amber)'], ['treatment_category', 0.037, 'var(--blue)']];
      return `

    <div class="stat-card" style="--accent-color:var(--green)"><div class="stat-label">Model AUC-ROC</div><div class="stat-val">0.799</div><div class="stat-sub">no_show_xgboost v2.1</div></div>

  </div>

    async function runPredict() {
      const el = document.getElementById('ml-res');
      el.innerHTML = '<div style="text-align:center;padding:16px"><div class="spinner"></div></div>';
      const r = await api('POST', '/ml/predict/manual', { lead_time_days: parseInt(document.getElementById('ml-ld').value) || 0, prior_no_shows: parseInt(document.getElementById('ml-pr').value) || 0, appointment_hour: parseInt(document.getElementById('ml-hr').value) || 10, age: parseInt(document.getElementById('ml-ag').value) || 30, distance_km: parseFloat(document.getElementById('ml-di').value) || 5, treatment_cost: parseFloat(document.getElementById('ml-co').value) || 1000, previous_appointments: 2, month: 5, reminder_sent: parseInt(document.getElementById('ml-rm').value), has_insurance: parseInt(document.getElementById('ml-in').value), is_follow_up: 0, gender: 'other', day_of_week: document.getElementById('ml-dy').value, treatment_category: document.getElementById('ml-ca').value });
      if (!r.success) { el.innerHTML = `<div class="err-msg" style="margin-top:12px">${r.error?.message}</div>`; return; }
      const d = r.data, pct = (d.no_show_probability * 100).toFixed(1);
      const color = d.risk_level === 'High' ? 'var(--red)' : d.risk_level === 'Medium' ? 'var(--amber)' : 'var(--green)';
      const bg = d.risk_level === 'High' ? 'var(--red-bg)' : d.risk_level === 'Medium' ? 'var(--amber-bg)' : 'var(--green-bg)';
      const bd = d.risk_level === 'High' ? 'var(--red-bd)' : d.risk_level === 'Medium' ? 'var(--amber-bd)' : 'var(--green-bd)';
      el.innerHTML = `<div style="margin-top:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:18px;animation:slideUp .2s">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px">No-show probability</div>
      <div style="font-family:var(--serif);font-size:54px;line-height:1;color:${color}">${pct}%</div>
      <div style="margin-top:8px">${riskBadge(d.risk_level, d.no_show_probability)}</div>
    </div>
    <div style="background:${bg};border:1px solid ${bd};border-left:3px solid ${color};border-radius:8px;padding:10px 13px;font-size:13px;color:${color}">${d.recommended_action}</div>
    <div style="margin-top:10px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between"><span>Model v${d.model_version}</span><span>Confidence: ${d.confidence} · Threshold: ${d.threshold_used}</span></div>
  </div>`;
    }

    function priorityBadge(p) {
      const cfg = {
        urgent: { cls: 'bg-red', label: 'Urgent' },
        high: { cls: 'bg-amber', label: 'High' },
        normal: { cls: 'bg-blue', label: 'Normal' },
        low: { cls: 'bg-gray', label: 'Low' },
      };
      const c = cfg[p] || cfg.normal;
      return `<span class="badge ${c.cls}" title="Priority: ${c.label}">${c.label}</span>`;
    }

    function filterByPriority(p) {
      // update button styles
      ['all', 'urgent', 'high', 'normal'].forEach(id => {
        const el = document.getElementById('pf-' + id);
        if (!el) return;
        const active = (p === '' && id === 'all') || p === id;
        el.style.borderColor = active ? 'var(--green)' : 'var(--border)';
        el.style.color = active ? 'var(--green)' : 'var(--text2)';
        el.style.fontWeight = active ? '600' : '500';
      });
      const rows = document.querySelectorAll('#ap-body tr');
      rows.forEach(r => {
        if (!p) { r.style.display = ''; return; }
        // priority cell is index 4 (Patient=0,Doctor=1,DateTime=2,Reason=3,Status=4,Risk=5,Priority=6... wait check col order)
        const cells = r.querySelectorAll('td');
        const priCell = cells[4]; // priority is 5th column (0-indexed: patient,doctor,datetime,reason,priority,status,risk,actions)
        r.style.display = (priCell && priCell.textContent.toLowerCase().includes(p)) ? '' : 'none';
      });
    }

          <td style="padding:4px"><input class="rx-m-dur" value="${esc(dur)}" placeholder="5 days" style="width:100%;padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px"/></td>
